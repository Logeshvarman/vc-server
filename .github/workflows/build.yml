name: KeepBuild

on:
  push:
    branches: [bonk-demo]        # run only in dev branch
  pull_request:
    branches: [main, bonk-demo]

permissions:
  contents: write                # allow commits from workflow
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js 20.2.0
      uses: actions/setup-node@v4
      with:
        node-version: '20.2.0'

    - name: Install dependencies
      run: npm ci

    # Automatically lint and fix code
    - name: Run ESLint & Prettier auto-fix
      run: |
        echo "Running ESLint & Prettier auto-fix..."
        npx eslint . --ext .js,.ts --fix || true
        npx prettier --write . || true

    
    # Run your project tests
    - name: Run tests
      env:
        NODE_ENV: development
      run: |
        echo "Running test suite..."
        npm test || echo " Tests failed — please review."

    # Start dev server only if tests passed
    - name: Start server with nodemon
      if: success()
      run: |
        echo "Starting dev server..."
        npm run dev || npm start
